---
- name: Bootstrap k3s Control Node
  hosts: k3s_control
  become: true

  tasks:
    - name: Install k3s server
      shell: curl -sfL https://get.k3s.io | sh -
      environment:
        K3S_KUBECONFIG_MODE: "644"

    - name: Retrieve node join token
      command: cat /var/lib/rancher/k3s/server/node-token
      register: node_token_output

    - name: Store token as a variable for workers
      set_fact:
        k3s_token: "{{ node_token_output.stdout }}"

- name: Join k3s Worker Nodes
  hosts: k3s_workers
  become: true
  tasks:
    - name: Install k3s agent
      shell: >
        curl -sfL https://get.k3s.io | 
        K3S_URL=https://{{ groups['k3s_control'][0] }}:6443 
        K3S_TOKEN={{ hostvars[groups['k3s_control'][0]]['k3s_token'] }} 
        sh -
